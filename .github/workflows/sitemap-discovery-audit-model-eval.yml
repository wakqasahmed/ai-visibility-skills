name: Sitemap Discovery Audit Model Eval

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Trials per fixture per condition"
        required: false
        default: "4"
      threshold:
        description: "Minimum skill-enabled pass rate to pass the job"
        required: false
        default: "0.8"
      model:
        description: "Anthropic model id"
        required: false
        default: "claude-sonnet-4-5"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check for ANTHROPIC_API_KEY
        id: check-secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping the live model-harness eval. Add the secret in repo settings to enable this layer."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install anthropic SDK
        if: steps.check-secret.outputs.has_key == 'true'
        run: pip install anthropic
      - name: Run skill-enabled vs skill-disabled model eval
        if: steps.check-secret.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIALS: ${{ github.event.inputs.trials || '4' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.8' }}
          MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-5' }}
        run: |
          python3 eval/ai-visibility/sitemap-discovery-audit/model_harness.py \
            --trials "$TRIALS" \
            --threshold "$THRESHOLD" \
            --model "$MODEL" \
            --output sitemap-discovery-audit-model-eval-results.json
      - name: Upload results
        if: steps.check-secret.outputs.has_key == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitemap-discovery-audit-model-eval-results
          path: sitemap-discovery-audit-model-eval-results.json
      - name: Report skip
        if: steps.check-secret.outputs.has_key != 'true'
        run: echo "Skipped - ANTHROPIC_API_KEY secret not configured for this repository."
