name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: List skills
        run: scripts/list-skills.sh | grep -q "skills/ai-visibility/ai-visibility-audit/SKILL.md"
      - name: Validate plugin paths
        run: python3 scripts/validate-plugin.py
      - name: Validate citation ledger
        run: python3 scripts/validate-citations.py
      - name: Run ai-visibility-audit behavioral eval
        run: python3 eval/ai-visibility/ai-visibility-audit/run_eval.py
      - name: Run robots-ai-crawler-audit deterministic contract eval
        run: python3 eval/ai-visibility/robots-ai-crawler-audit/run_eval.py
      - name: Run answer-engine-content-audit deterministic contract eval
        run: python3 eval/ai-visibility/answer-engine-content-audit/run_eval.py
      - name: Run ai-visibility-audit deterministic outcome-contract eval
        run: python3 eval/ai-visibility/ai-visibility-audit/run_outcome_eval.py
      - name: Run citation-readiness-audit deterministic contract eval
        run: python3 eval/ai-visibility/citation-readiness-audit/run_eval.py
      - name: Run ai-search-remediation-plan deterministic contract eval
        run: python3 eval/ai-visibility/ai-search-remediation-plan/run_eval.py
      - name: Run schema-markup-audit deterministic contract eval
        run: python3 eval/ai-visibility/schema-markup-audit/run_eval.py
        timeout-minutes: 10
      - name: Run llms-txt-generator deterministic contract eval
        run: python3 eval/ai-visibility/llms-txt-generator/run_eval.py
        timeout-minutes: 10
      - name: Run sitemap-discovery-audit deterministic contract eval
        run: python3 eval/ai-visibility/sitemap-discovery-audit/run_eval.py
      - name: Run image-audit deterministic contract eval
        run: python3 eval/ai-visibility/image-audit/run_eval.py
