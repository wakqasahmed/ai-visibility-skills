name: International SEO Hreflang Audit Model Eval

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Trials per fixture per condition"
        required: false
        default: "4"
      threshold:
        description: "Minimum skill-enabled pass rate to pass the job"
        required: false
        default: "0.8"
      model:
        description: "Anthropic model id"
        required: false
        default: "claude-sonnet-4-5"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-anthropic
      - name: Check for ANTHROPIC_API_KEY
        id: check-secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping the live model-harness eval. Add the secret in repo settings to enable this layer."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install anthropic SDK
        if: steps.check-secret.outputs.has_key == 'true'
        run: pip install anthropic
      - name: Run skill-enabled vs skill-disabled model eval
        if: steps.check-secret.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIALS: ${{ github.event.inputs.trials || '4' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.8' }}
          MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-5' }}
        run: |
          python3 eval/ai-visibility/international-seo-hreflang-audit/model_harness.py \
            --trials "$TRIALS" \
            --threshold "$THRESHOLD" \
            --model "$MODEL" \
            --output international-seo-hreflang-audit-model-eval-results.json
      - name: Upload results
        if: steps.check-secret.outputs.has_key == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: international-seo-hreflang-audit-model-eval-results
          path: international-seo-hreflang-audit-model-eval-results.json
      - name: Report skip
        if: steps.check-secret.outputs.has_key != 'true'
        run: echo "Skipped - ANTHROPIC_API_KEY secret not configured for this repository."
